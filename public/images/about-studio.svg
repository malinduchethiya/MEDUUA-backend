<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182c24"/>
      <stop offset="100%" stop-color="#0c1713"/>
    </linearGradient>
  </defs>

  <rect width="600" height="450" fill="url(#wallGrad)"/>

  <!-- Minimalist Studio Interior Composition -->
  <!-- Floor line -->
  <polygon points="0,320 600,320 600,450 0,450" fill="#080e0c"/>

  <!-- Large Architectural Window Casting Natural Light -->
  <polygon points="340,40 560,40 560,280 340,280" fill="#243830" opacity="0.4"/>
  <line x1="450" y1="40" x2="450" y2="280" stroke="#0e1713" stroke-width="4"/>
  <line x1="340" y1="160" x2="560" y2="160" stroke="#0e1713" stroke-width="4"/>

  <!-- Studio Wall Plaque with MEDUUA Branding -->
  <rect x="80" y="80" width="180" height="90" fill="#0f1c17" stroke="#c9a66b" stroke-width="1.5"/>
  <text x="170" y="125" fill="#f4f0e7" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" letter-spacing="4" text-anchor="middle">MEDUUA</text>
  <text x="170" y="148" fill="#c9a66b" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="3" text-anchor="middle">DIGITAL STUDIO</text>

  <!-- Travertine / Oak Studio Desk -->
  <polygon points="60,280 540,280 570,360 30,360" fill="#1c2d26" stroke="#2c4238" stroke-width="1.5"/>
  <polygon points="30,360 570,360 570,375 30,375" fill="#121e19"/>

  <!-- Laptop on Desk -->
  <polygon points="230,240 370,240 380,310 220,310" fill="#2c3a35" stroke="#3d4f48" stroke-width="1"/>
  <polygon points="238,246 362,246 372,304 228,304" fill="#0a120f"/>
  <circle cx="300" cy="275" r="8" fill="#c9a66b"/>
  <polygon points="215,310 385,310 395,335 205,335" fill="#18241f"/>

  <!-- Architectural Plant on Desk -->
  <path d="M470,260 Q490,210 520,200 Q505,230 475,270 Z" fill="#2d5a47"/>
  <path d="M465,270 Q440,220 420,210 Q435,240 460,280 Z" fill="#244a3a"/>
  <path d="M475,280 Q510,240 540,250 Q515,270 478,285 Z" fill="#366b55"/>
  <!-- Plant Pot -->
  <polygon points="450,280 490,280 485,325 455,325" fill="#c9a66b"/>
</svg>
