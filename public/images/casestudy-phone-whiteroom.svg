<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3734"/>
      <stop offset="100%" stop-color="#111715"/>
    </linearGradient>
  </defs>

  <!-- Phone Case -->
  <rect x="10" y="10" width="300" height="600" rx="42" fill="url(#phoneFrame)" stroke="#3e4d47" stroke-width="2.5"/>
  <!-- Inner Bezel -->
  <rect x="18" y="18" width="284" height="584" rx="36" fill="#000000"/>
  <!-- Screen Area -->
  <rect x="22" y="22" width="276" height="576" rx="32" fill="#090d0c"/>

  <!-- Speaker & Camera Hole -->
  <circle cx="160" cy="40" r="5" fill="#1e2825"/>

  <!-- White Room App UI on Screen -->
  <!-- Top Bar -->
  <text x="45" y="75" fill="#f4f0e7" font-family="monospace" font-size="11" letter-spacing="2">09:41</text>
  <text x="160" y="110" fill="#f4f0e7" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" letter-spacing="3" text-anchor="middle">WHITE ROOM</text>
  <text x="160" y="128" fill="#c9a66b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" letter-spacing="2" text-anchor="middle">PROTOCOL ARCHIVE</text>

  <!-- Glowing Doorway in Center of Phone -->
  <rect x="135" y="165" width="50" height="150" fill="#ffffff" opacity="0.95"/>
  <circle cx="160" cy="240" r="60" fill="#ff3b30" opacity="0.3" filter="blur(15px)"/>
  
  <!-- Silhouette Figure -->
  <circle cx="160" cy="275" r="10" fill="#090d0c"/>
  <path d="M142,330 C142,295 150,290 160,290 C170,290 178,295 178,330 Z" fill="#090d0c"/>
  <circle cx="160" cy="305" r="2.5" fill="#ff3b30"/>

  <!-- Start Button on Phone -->
  <rect x="60" y="375" width="200" height="44" rx="22" fill="#183d35" stroke="#c9a66b" stroke-width="1.5"/>
  <text x="160" y="402" fill="#f4f0e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" letter-spacing="2" text-anchor="middle">ENTER PROTOCOL</text>

  <!-- Bottom Stats Grid on Phone -->
  <rect x="45" y="445" width="105" height="60" rx="10" fill="#101916" stroke="#1f2f29" stroke-width="1"/>
  <text x="58" y="468" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">DISCIPLINE</text>
  <text x="58" y="492" fill="#c9a66b" font-family="monospace" font-size="15" font-weight="bold">94.8%</text>

  <rect x="170" y="445" width="105" height="60" rx="10" fill="#101916" stroke="#1f2f29" stroke-width="1"/>
  <text x="183" y="468" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">STREAK</text>
  <text x="183" y="492" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold">28 DAYS</text>

  <!-- Bottom Home Bar -->
  <rect x="110" y="580" width="100" height="4" rx="2" fill="#ffffff" opacity="0.6"/>
</svg>
