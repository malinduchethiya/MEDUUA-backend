<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="laptopLid2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3734"/>
      <stop offset="100%" stop-color="#141a18"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#090f0d"/>

  <!-- Laptop Base Shadow -->
  <ellipse cx="400" cy="430" rx="300" ry="30" fill="#000000" opacity="0.6"/>

  <!-- Screen Lid -->
  <polygon points="170,90 630,90 660,370 140,370" fill="url(#laptopLid2)" stroke="#3e4d47" stroke-width="2"/>
  
  <!-- Screen Area (Warm Ivory Light Website) -->
  <polygon points="182,102 618,102 646,358 154,358" fill="#f8f5ee"/>

  <!-- Sinhala Platform Website Mockup on Screen -->
  <g>
    <!-- Header of website -->
    <rect x="182" y="102" width="436" height="34" fill="#102b25"/>
    <text x="200" y="124" fill="#f4f0e7" font-family="Georgia, serif" font-size="12" font-weight="700">මෙත්තා · Sinhala Content Platform</text>
    <text x="560" y="123" fill="#c9a66b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">ISSUES</text>
    <text x="595" y="123" fill="#c9a66b" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">ABOUT</text>

    <!-- Content area 2-column layout -->
    <rect x="195" y="145" width="260" height="110" fill="#ffffff" stroke="#e6e1d6" stroke-width="1"/>
    <!-- Article headline -->
    <text x="210" y="168" fill="#111715" font-family="Georgia, serif" font-size="13" font-weight="bold">Digital Publishing &amp; Literature</text>
    <text x="210" y="185" fill="#64748b" font-family="sans-serif" font-size="8">Unicode Indic Script Typography for Modern Essays</text>
    <!-- Article graphic banner -->
    <rect x="210" y="195" width="230" height="48" fill="#102b25"/>
    <text x="325" y="225" fill="#c9a66b" font-family="Georgia, serif" font-size="16" text-anchor="middle">අක්ෂර කලාව</text>

    <!-- Side Column with articles -->
    <rect x="465" y="145" width="140" height="110" fill="#ffffff" stroke="#e6e1d6" stroke-width="1"/>
    <text x="475" y="162" fill="#102b25" font-family="Georgia, serif" font-size="10" font-weight="bold">Recent Monographs</text>
    <rect x="475" y="172" width="120" height="6" fill="#e2e8f0"/>
    <rect x="475" y="182" width="100" height="6" fill="#e2e8f0"/>
    <rect x="475" y="198" width="120" height="6" fill="#e2e8f0"/>
    <rect x="475" y="208" width="90" height="6" fill="#e2e8f0"/>

    <!-- Bottom articles row -->
    <rect x="195" y="265" width="130" height="75" fill="#ffffff" stroke="#e6e1d6" stroke-width="1"/>
    <rect x="205" y="275" width="110" height="35" fill="#1b3830"/>
    <rect x="205" y="316" width="90" height="5" fill="#334155"/>
    <rect x="205" y="325" width="70" height="5" fill="#94a3b8"/>

    <rect x="335" y="265" width="130" height="75" fill="#ffffff" stroke="#e6e1d6" stroke-width="1"/>
    <rect x="345" y="275" width="110" height="35" fill="#1b3830"/>
    <rect x="345" y="316" width="90" height="5" fill="#334155"/>
    <rect x="345" y="325" width="70" height="5" fill="#94a3b8"/>

    <rect x="475" y="265" width="130" height="75" fill="#ffffff" stroke="#e6e1d6" stroke-width="1"/>
    <rect x="485" y="275" width="110" height="35" fill="#1b3830"/>
    <rect x="485" y="316" width="90" height="5" fill="#334155"/>
    <rect x="485" y="325" width="70" height="5" fill="#94a3b8"/>
  </g>

  <!-- Laptop Base -->
  <polygon points="140,370 660,370 710,430 90,430" fill="#1a2420" stroke="#31423c" stroke-width="2"/>
  <polygon points="90,430 710,430 710,438 90,438" fill="#101715"/>
  <polygon points="340,390 460,390 468,425 332,425" fill="#121a17" stroke="#253530" stroke-width="1"/>
</svg>
