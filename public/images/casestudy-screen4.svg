<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 380" width="100%" height="100%">
  <rect width="240" height="380" rx="20" fill="#090e0c" stroke="#26342f" stroke-width="2"/>
  <!-- Phone Screen 4: Progress Analytics -->
  <rect x="10" y="10" width="220" height="360" rx="14" fill="#070c0a"/>
  <text x="25" y="45" fill="#f4f0e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold">Progress</text>
  <text x="25" y="60" fill="#94a3b8" font-family="monospace" font-size="8">WEEKLY DISCIPLINE INDEX</text>

  <!-- Bar Chart -->
  <g transform="translate(25, 90)">
    <line x1="0" y1="140" x2="190" y2="140" stroke="#1f2f29" stroke-width="1"/>
    
    <!-- Mon -->
    <rect x="10" y="40" width="16" height="100" rx="4" fill="#183d35"/>
    <text x="18" y="155" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">M</text>

    <!-- Tue -->
    <rect x="36" y="20" width="16" height="120" rx="4" fill="#183d35"/>
    <text x="44" y="155" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">T</text>

    <!-- Wed -->
    <rect x="62" y="60" width="16" height="80" rx="4" fill="#183d35"/>
    <text x="70" y="155" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">W</text>

    <!-- Thu -->
    <rect x="88" y="10" width="16" height="130" rx="4" fill="#c9a66b"/>
    <text x="96" y="155" fill="#c9a66b" font-family="monospace" font-size="8" text-anchor="middle">T</text>

    <!-- Fri -->
    <rect x="114" y="30" width="16" height="110" rx="4" fill="#183d35"/>
    <text x="122" y="155" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">F</text>

    <!-- Sat -->
    <rect x="140" y="50" width="16" height="90" rx="4" fill="#183d35"/>
    <text x="148" y="155" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">S</text>

    <!-- Sun -->
    <rect x="166" y="25" width="16" height="115" rx="4" fill="#183d35"/>
    <text x="174" y="155" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">S</text>
  </g>

  <!-- Summary Card -->
  <rect x="25" y="275" width="190" height="50" rx="8" fill="#111f1a" stroke="#253a32" stroke-width="1"/>
  <text x="40" y="297" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">DISCIPLINE SCORE</text>
  <text x="40" y="315" fill="#c9a66b" font-family="monospace" font-size="14" font-weight="bold">+24% THIS WEEK</text>
</svg>
