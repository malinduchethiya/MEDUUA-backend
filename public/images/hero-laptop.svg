<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <radialGradient id="deskGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a2e26" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0e1714" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080d0b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="laptopLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3330"/>
      <stop offset="100%" stop-color="#121816"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1210"/>
      <stop offset="50%" stop-color="#111f1a"/>
      <stop offset="100%" stop-color="#0c1613"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f5e6a2"/>
    </linearGradient>
    <filter id="screenBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="900" height="650" fill="url(#deskGlow)"/>

  <!-- Subtle Studio Environment Grid & Bokeh -->
  <g opacity="0.15">
    <line x1="100" y1="0" x2="100" y2="650" stroke="#c9a66b" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="650" stroke="#c9a66b" stroke-width="1"/>
    <line x1="0" y1="520" x2="900" y2="520" stroke="#c9a66b" stroke-width="1"/>
  </g>
  <circle cx="780" cy="120" r="90" fill="#c9a66b" opacity="0.04" filter="blur(30px)"/>

  <!-- Laptop Base Shadow -->
  <ellipse cx="450" cy="535" rx="360" ry="40" fill="#000000" opacity="0.6"/>

  <!-- Laptop Screen Lid (Angled Perspective) -->
  <polygon points="170,110 730,110 770,440 130,440" fill="url(#laptopLid)" stroke="#3a4a44" stroke-width="2"/>
  
  <!-- Screen Display Inner Area -->
  <polygon points="185,125 715,125 753,425 147,425" fill="url(#screenGrad)" stroke="#1a2420" stroke-width="1.5"/>

  <!-- Screen Content: "Ideas. Products. Experiences." -->
  <g>
    <!-- Top window dots -->
    <circle cx="210" cy="145" r="3.5" fill="#e06c75" opacity="0.8"/>
    <circle cx="225" cy="145" r="3.5" fill="#e5c07b" opacity="0.8"/>
    <circle cx="240" cy="145" r="3.5" fill="#98c379" opacity="0.8"/>

    <!-- Subtle branding line on screen -->
    <text x="450" y="210" fill="#c9a66b" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="4" text-anchor="middle" opacity="0.8">MEDUUA STUDIO</text>
    
    <!-- Big Bold Typography matching screenshot -->
    <text x="450" y="270" fill="#f5f2eb" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="600" text-anchor="middle">Ideas.</text>
    <text x="450" y="325" fill="#f5f2eb" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="600" text-anchor="middle">Products.</text>
    <text x="450" y="380" fill="url(#goldText)" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="600" text-anchor="middle">Experiences.</text>

    <!-- Subtle glowing divider -->
    <line x1="380" y1="400" x2="520" y2="400" stroke="#c9a66b" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Laptop Keyboard Base (Forward Perspective) -->
  <polygon points="130,440 770,440 840,530 60,530" fill="#18221e" stroke="#2c3a35" stroke-width="2"/>
  <!-- Base Front Lip -->
  <polygon points="60,530 840,530 840,540 60,540" fill="#0f1513" stroke="#222e2a" stroke-width="1"/>
  <rect x="420" y="530" width="60" height="4" rx="2" fill="#3a4843"/>

  <!-- Trackpad -->
  <polygon points="380,470 520,470 530,520 370,520" fill="#121a17" stroke="#26342f" stroke-width="1"/>

  <!-- Keyboard Key Area Indication -->
  <polygon points="180,448 720,448 740,465 160,465" fill="#101715" opacity="0.7"/>
</svg>
