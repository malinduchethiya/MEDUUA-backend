<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <rect width="1200" height="900" fill="#102B25"/>
  <!-- Architectural Minimalist Composition -->
  <rect x="80" y="80" width="1040" height="740" fill="none" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="140" y="140" width="460" height="620" fill="#111715" stroke="#26473F" stroke-width="1"/>
  <rect x="640" y="140" width="420" height="360" fill="#F4F0E7"/>
  <rect x="640" y="540" width="420" height="220" fill="#153830" stroke="#C9A66B" stroke-width="1"/>
  <!-- Left Panel Typography & Geometry -->
  <circle cx="370" cy="360" r="110" fill="none" stroke="#C9A66B" stroke-width="1.5"/>
  <line x1="260" y1="360" x2="480" y2="360" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="370" y1="250" x2="370" y2="470" stroke="#C9A66B" stroke-width="1" stroke-opacity="0.5"/>
  <text x="190" y="575" fill="#F4F0E7" font-family="Georgia, serif" font-size="38" font-weight="bold">MEDUUA</text>
  <text x="190" y="615" fill="#C9A66B" font-family="monospace" font-size="13" letter-spacing="3">DESIGN &amp; SOFTWARE ARCHITECTURE</text>
  <text x="190" y="660" fill="#9BB0A9" font-family="sans-serif" font-size="15">Precision-built web systems and</text>
  <text x="190" y="685" fill="#9BB0A9" font-family="sans-serif" font-size="15">editorial digital products.</text>
  <!-- Right Top Ivory Panel -->
  <text x="690" y="215" fill="#102B25" font-family="monospace" font-size="13" letter-spacing="2">PRINCIPLE 01</text>
  <text x="690" y="275" fill="#111715" font-family="Georgia, serif" font-size="36" font-weight="bold">Clarity Over</text>
  <text x="690" y="320" fill="#111715" font-family="Georgia, serif" font-size="36" font-weight="bold">Ornamentation.</text>
  <line x1="690" y1="360" x2="990" y2="360" stroke="#111715" stroke-width="1" stroke-opacity="0.2"/>
  <text x="690" y="405" fill="#3D4A46" font-family="sans-serif" font-size="15">Every layout grid, typographic scale,</text>
  <text x="690" y="430" fill="#3D4A46" font-family="sans-serif" font-size="15">and database query is intentional.</text>
  <!-- Right Bottom Dark Panel -->
  <text x="690" y="605" fill="#C9A66B" font-family="monospace" font-size="13" letter-spacing="2">CRAFTED IN SRI LANKA</text>
  <text x="690" y="655" fill="#F4F0E7" font-family="Georgia, serif" font-size="28">Bespoke Web Engineering</text>
  <text x="690" y="695" fill="#B5C2BD" font-family="monospace" font-size="13">REACT · TYPESCRIPT · CLOUD NATIVE</text>
